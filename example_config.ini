[Paths]
data_folder_path = /<user>/BabelBrain_Unit_Testing/unit_test_data
ref_output_folder_1 = /<user>/BabelBrain_Unit_Testing/Generated_Outputs/METAL
ref_output_folder_2 = /<user>/BabelBrain_Unit_Testing/Generated_Outputs/MLX
gen_output_folder = /<user>/BabelBrain_Unit_Testing/Generated_Outputs/v0.4.2

# SimNIBS install folder (contains simnibs_env). Optional: soft tissue segmentation and PlanTUS tests skip without it
simnibs_root_path = /<user>/Applications/SimNIBS-4.1

[GPU]
device_name = M1

# Optional: BabelBrain job server used by test_e2e_remote_full_pipeline. Without this section
# the test starts a local headless server (BabelBrain.py --serve).
# [Remote]
# name = lab-workstation
# host = 10.0.0.5
# port = 8760
# token = <token>
# https = false
